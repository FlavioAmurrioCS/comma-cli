[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "comma-cli"
dynamic = ["version"]
description = "Multi-Tool"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [
  { name = "Flavio Amurrio", email = "25621374+FlavioAmurrioCS@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "persistent-cache-decorator",
  "pyfunctional",
  "requests",
  "urllib3<2.0.0",
  "rich",
  "runtool",
  "typedfzf",
  "typer",
  "typing-extensions",
]

[project.optional-dependencies]
types = [
]
tests = [
  "comma-cli[types]",
]
personal = [
  "fastapi",
  "polyfactory",
  "pydantic",
  "selenium",
  "twilio",
  "uvicorn[standard]",
]

[project.scripts]
dev = "comma.main:app_main"
',' = "comma.main:app_main"
',c' = "comma.misc.code:app_c"
',devcon' = "comma.devcon:app_devcon"
',docker' = "comma.docker:app_docker"
',mux' = "comma.misc.tmux:app_mux"
',reflection' = "comma._typer.reflection:_main"
',sh' = "comma.shell_scripts.shell_utils:app_sh"
',sh-script' = "comma.shell_scripts.shell_scripts:app_shell_scripts"
',bored' = "bored.cli:app"

[project.urls]
Documentation = "https://github.com/FlavioAmurrioCS/comma-cli#readme"
Issues = "https://github.com/FlavioAmurrioCS/comma-cli/issues"
Source = "https://github.com/FlavioAmurrioCS/comma-cli"

###############################################################################
# region: hatch
###############################################################################
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/comma/_version.py"

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "comma-cli[tests]",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
  "comma-cli[types]",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/comma tests}"
###############################################################################
# endregion: hatch
###############################################################################

###############################################################################
# region: uv
###############################################################################
[tool.uv.pip]
index-url = "https://pypi.org/simple"
###############################################################################
# endregion: uv
###############################################################################

###############################################################################
# region: coverage
###############################################################################
[tool.coverage.run]
source_pkgs = ["comma", "gron", "gum"]
branch = true
parallel = true
omit = [
]

[tool.coverage.paths]
comma = [
  "src/comma",
  "*/comma-cli/src/comma",
  "src/gron",
  "*/comma-cli/src/gron",
  "src/gum",
  "*/comma-cli/src/gum",
]
tests = ["tests", "*/comma-cli/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/comma",
  "src/gron",
  "src/gum",
  "src/bored",
]
###############################################################################
# endregion: coverage
###############################################################################

###############################################################################
# region: pyright
###############################################################################
[tool.pyright]
pythonVersion = "3.9"
###############################################################################
# endregion: pyright
###############################################################################

###############################################################################
# region: mypy
###############################################################################
[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
###############################################################################
# endregion: mypy
###############################################################################

###############################################################################
# region: ruff
###############################################################################
[tool.hatch.envs.hatch-static-analysis]
config-path = "none"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "ALL",
]
ignore = [
  "COM812", # missing-trailing-comma
  "D",      # pydocstyle
  "ERA001", # commented-out-code
  "EXE003", # shebang-missing-python
  "ISC001", # single-line-implicit-string-concatenation
  "PTH",    # flake8-use-pathlib
  "T20",    # flake8-print
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]
###############################################################################
# endregion: ruff
###############################################################################
